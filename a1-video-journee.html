<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Dersler · İzle ve Tekrar Et</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--c:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--text:#e5e7eb;--muted:#9ca3af;--line:#334155}}
html{scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 48px}
.back{display:inline-block;margin-bottom:12px;color:#2563eb;text-decoration:none;font-size:.95rem}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{color:var(--muted);margin:0 0 20px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px;padding:0;list-style:none}
.steps li,.card,.toc-card{background:var(--card);border:1px solid var(--line)}
.steps li{border-radius:999px;padding:6px 14px;font-size:.9rem}
.card,.toc-card{border-radius:16px;padding:16px}
.toc-card{margin-bottom:24px}
.toc-card h3{margin:0 0 10px;font-size:1.05rem;color:#2563eb}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.toc-item{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.toc-item:hover{border-color:var(--c)}
.toc-item .tag{margin:0;flex-shrink:0;font-size:.7rem;padding:1px 8px}
.toc-item b{display:block;font-size:.88rem}
.toc-item small{color:var(--muted);font-size:.78rem}
.sec-h{margin:28px 0 6px;font-size:1.2rem;color:var(--c)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card h2{margin:0 0 2px;font-size:1.15rem}
.tag{display:inline-block;font-size:.78rem;font-weight:600;color:#fff;background:var(--c);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.player{position:relative;width:100%;max-width:300px;margin:10px auto;aspect-ratio:9/16;background:#000;border-radius:14px;overflow:hidden}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
button{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--c)}
button.on{background:var(--c);color:#fff;border-color:var(--c)}
.text{display:none;margin-top:12px;padding:12px;border-left:4px solid var(--c);background:var(--bg);border-radius:8px}
.text.show{display:block}
.text p{margin:4px 0;font-size:1.02rem}
.text em{color:var(--muted);font-size:.88rem}
.note{margin-top:22px;color:var(--muted);font-size:.9rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html#unite1">← Derslere dön</a>
  <h1>Video Dersler · İzle ve tekrar et</h1>
  <p class="sub">Fransızca diyalog videoları. Sadece izle, dinle ve tekrar et.</p>
  <ol class="steps"><li>1. İzle</li><li>2. Yavaş izle</li><li>3. Metni aç, birlikte söyle</li></ol>
  <div class="toc-card"><h3>📋 Hızlı Dizin</h3><div class="toc-grid" id="toc"></div></div>
  <div id="app"></div>
  <p class="note">İpucu: "Tekrar modu" açıkken video bitince kendiliğinden yeniden başlar.</p>
</div>

<script>
/* Yeni video eklemek için: ilgili bölümün v listesine bir satır ekle:
   [anahtar, "YouTube kimliği", "Kart başlığı", "Dizin başlığı", ["replik 1", "replik 2", ...]] */
var S = [
 {t:"🎬 Ma journée · Günlük rutin", s:"Ma journée", c:"#2563eb", v:[
  ["mehmet","6TbTJggQMJE","Mehmet – Le matin","Mehmet – Le matin",
   ["Bonjour ! Je m'appelle Mehmet.","J'ai quinze ans.","Le matin, je me lève à sept heures."]],
  ["ipek","Qls9RDiiKu8","İpek – Le soir","İpek – Le soir",
   ["Salut ! Moi, c'est İpek.","Le soir, je fais mes devoirs.","Je me couche à neuf heures."]]]},
 {t:"❤️ Aimer, préférer · Beğeniler ve tercihler", s:"Aimer, préférer", c:"#059669", v:[
  ["aimer1","Ia3iv9W-zv8","Okulda · Tu aimes les maths ?","Tu aimes les maths ?",
   ["İpek, tu aimes les maths ?","Oui, j'aime les maths !","Et toi, qu'est-ce que tu préfères ?","Je préfère le français !"]],
  ["aimer2","LYoopboHy84","Parkta · Tu aimes l'anglais ?","Tu aimes l'anglais ?",
   ["Mehmet, tu aimes l'anglais ?","Non, je n'aime pas l'anglais.","Je préfère le sport !"]]]},
 {t:"⚽ Faire du sport · Spor", s:"Sport", c:"#7c3aed", v:[
  ["sport","mhYWMfut0rM","Parkta · Tu fais du sport ?","Tu fais du sport ?",
   ["Salut İpek, tu fais du sport ?","Oui, je joue au tennis.","Et toi Mehmet ?","Moi, je joue au football !"]]]},
 {t:"🍽️ Au restaurant, au café · Restoran ve kafe", s:"Restoran ve kafe", c:"#dc2626", v:[
  ["resto","YmEm6M1vY-8","Restoranda · Bon appétit !","Bon appétit !",
   ["Pelin : Tu prends quoi, Mehmet ?","Mehmet : Je prends du poulet. Et toi ?","Pelin : Moi, de la salade.","Pelin : Miam ! C'est très bon !","Mehmet : Oui ! J'aime ça !","Pelin : Bon appétit, Mehmet !"]],
  ["cafe","ldOZrtvQJm8","Kafede · Je voudrais un jus d'orange","Je voudrais…, s'il vous plaît",
   ["İpek : Je voudrais un jus d'orange, s'il vous plaît.","Garson : Et pour vous ?","Mehmet : Un chocolat chaud, merci.","Garson : Voilà ! Bon appétit !","İpek : Merci ! C'est très bon !","Mehmet : Oui, c'est super !"]]]},
 {t:"🛍️ Au magasin, les transports · Alışveriş ve ulaşım", s:"Alışveriş ve ulaşım", c:"#0891b2", v:[
  ["shopping","8pnDThnoi0w","Mağazada · C'est combien ?","C'est combien ?",
   ["İpek : Mehmet, regarde ! Un pull bleu !","Mehmet : Il est beau ! C'est combien ?","İpek : Vingt euros.","Mehmet : Je prends le pull bleu !","İpek : Moi, je prends la robe rouge.","Mehmet : Super ! Allons payer !"]],
  ["ulasim","OkeApI-PGAU","Durakta · Tu vas où ?","Tu vas où ?",
   ["Tu vas où, İpek ?","À l'école, en bus.","Et toi, Mehmet ?","Moi, je vais à l'école à pied."]]]},
 {t:"🏖️ En vacances · Tatilde", s:"Tatil", c:"#0284c7", v:[
  ["vacances","1Gjf0Ll17fs","Tatilde · Nous sommes en vacances !","En vacances !",
   ["Mehmet : İpek, nous sommes en vacances !","İpek : Oui ! Il fait beau, allons à la plage !"]]]},
 {t:"💊 La santé · Sağlık", s:"Sağlık", c:"#4f46e5", v:[
  ["sante","prJcKGdtsXE","Sağlık · Tu es malade ?","Tu es malade ?",
   ["Tu vas bien ?","Non, je suis malade.","J'ai mal à la tête.","Prends soin de toi !"]]]},
 {t:"🎉 Le week-end · Hafta sonu ve hobiler", s:"Loisirs", c:"#0d9488", v:[
  ["weekend","Vl1uKCA_fOc","Hafta sonu · Qu'est-ce que tu fais le week-end ?","Le week-end",
   ["Mehmet : İpek, qu'est-ce que tu fais le week-end ?","İpek : Je joue du piano et je lis des livres. Et toi ?","Mehmet : Moi, je fais du vélo avec mes amis !","İpek : C'est super ! Tu aimes le cinéma ?","Mehmet : Oui, j'adore regarder des films !"]]]}
];

/* Sayfayı verilerden oluştur */
var BTNS = [["replay","↺ Baştan izle"],["slow","🐢 Yavaş (0.5x)"],["loop","🔁 Tekrar modu"],["text","📝 Metni göster"]];
var html = "", toc = "", n = 0;
S.forEach(function(s){
  html += '<h2 class="sec-h" style="--c:'+s.c+'">'+s.t+'</h2><div class="grid" style="--c:'+s.c+'">';
  s.v.forEach(function(v){
    var k = v[0]; n++;
    toc += '<a class="toc-item" style="--c:'+s.c+'" href="#sec-'+k+'"><span class="tag">V'+n+'</span><div><b>'+v[3]+'</b><small>'+s.s+'</small></div></a>';
    html += '<section class="card" id="sec-'+k+'"><span class="tag">Video '+n+'</span><h2>'+v[2]+'</h2>'
      + '<div class="player"><iframe id="player-'+k+'" src="https://www.youtube.com/embed/'+v[1]+'?rel=0&playsinline=1&enablejsapi=1&cc_load_policy=1&hl=fr" title="'+v[2]+'" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; web-share" allowfullscreen></iframe></div>'
      + '<div class="btns">' + BTNS.map(function(b){return '<button data-p="'+k+'" data-act="'+b[0]+'">'+b[1]+'</button>'}).join("") + '</div>'
      + '<div class="text" id="text-'+k+'">' + v[4].map(function(l){return '<p>'+l+'</p>'}).join("") + '<em>Metni videoyla birlikte yüksek sesle söyle.</em></div></section>';
  });
  html += '</div>';
});
document.getElementById("app").innerHTML = html;
document.getElementById("toc").innerHTML = toc;

/* YouTube oynatıcı kontrolleri (videolar API olmadan da görünür) */
var P = {}, L = {}, R = {};
function bind(k){
  if (P[k] || !R[k] || !(window.YT && YT.Player)) return;
  P[k] = new YT.Player("player-"+k, {events:{onStateChange:function(e){
    if (e.data === 0 && L[k]) { P[k].seekTo(0); P[k].playVideo(); }
  }}});
}
document.querySelectorAll("iframe[id^=player-]").forEach(function(f){
  f.addEventListener("load", function(){ R[f.id.slice(7)] = true; bind(f.id.slice(7)); });
});
window.onYouTubeIframeAPIReady = function(){ Object.keys(R).forEach(bind); };
var yt = document.createElement("script"); yt.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(yt);

document.addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-act]"); if (!b) return;
  var k = b.dataset.p, a = b.dataset.act, on;
  if (a === "text") {
    on = document.getElementById("text-"+k).classList.toggle("show");
    b.classList.toggle("on", on); b.textContent = on ? "📝 Metni gizle" : "📝 Metni göster"; return;
  }
  bind(k);
  var pl = P[k]; if (!pl || !pl.seekTo) return;
  if (a === "replay") { pl.seekTo(0); pl.playVideo(); }
  if (a === "slow") { on = !b.classList.contains("on"); pl.setPlaybackRate(on ? 0.5 : 1); b.classList.toggle("on", on); b.textContent = on ? "🐢 Normal hıza dön" : "🐢 Yavaş (0.5x)"; }
  if (a === "loop") { L[k] = !L[k]; b.classList.toggle("on", L[k]); if (L[k]) { pl.seekTo(0); pl.playVideo(); } }
});
</script>
</body>
</html>
